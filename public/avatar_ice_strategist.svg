<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Body -->
  <rect x="30" y="30" width="140" height="140" rx="28" ry="28" fill="url(#body)" stroke="#155e75" stroke-width="4"/>
  <!-- Scarf -->
  <path d="M30 148 Q100 160 170 148 L170 170 Q100 182 30 170 Z" fill="#f87171" stroke="#be123c" stroke-width="2"/>
  <path d="M30 148 Q100 155 170 148 L170 158 Q100 165 30 158 Z" fill="#fca5a5"/>
  <path d="M98 158 Q102 176 106 192 Q100 196 94 192 Q98 176 98 158" fill="#ef4444" stroke="#be123c" stroke-width="1.5"/>
  <!-- Pips: diagonal -->
  <circle cx="72" cy="72" r="7" fill="#0c4a6e"/>
  <circle cx="100" cy="86" r="7" fill="#0c4a6e"/>
  <circle cx="128" cy="72" r="7" fill="#0c4a6e"/>
  <circle cx="72" cy="110" r="7" fill="#0c4a6e"/>
  <circle cx="100" cy="124" r="7" fill="#0c4a6e"/>
  <circle cx="128" cy="110" r="7" fill="#0c4a6e"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="115" rx="12" ry="13" fill="white" stroke="#0c4a6e" stroke-width="2.5"/>
  <ellipse cx="118" cy="115" rx="12" ry="13" fill="white" stroke="#0c4a6e" stroke-width="2.5"/>
  <circle cx="84" cy="116" r="7" fill="#0c4a6e"/>
  <circle cx="120" cy="116" r="7" fill="#0c4a6e"/>
  <circle cx="86" cy="113" r="3" fill="white" opacity="0.9"/>
  <circle cx="122" cy="113" r="3" fill="white" opacity="0.9"/>
  <!-- Calm smile -->
  <path d="M90 134 Q100 142 110 134" stroke="#0c4a6e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Frost sparkles -->
  <text x="42" y="58" font-size="14" fill="#bae6fd" opacity="0.8">*</text>
  <text x="148" y="50" font-size="10" fill="#e0f2fe" opacity="0.8">*</text>
  <text x="152" y="120" font-size="12" fill="#bae6fd" opacity="0.7">*</text>
  <!-- Rim glow -->
  <rect x="30" y="30" width="140" height="140" rx="28" fill="none" stroke="#a5f3fc" stroke-width="3" opacity="0.6"/>
  <!-- Gloss -->
  <ellipse cx="64" cy="52" rx="20" ry="9" fill="white" opacity="0.28" transform="rotate(-18 64 52)"/>
