<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#166534"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Body -->
  <rect x="30" y="30" width="140" height="140" rx="28" ry="28" fill="url(#body)" stroke="#14532d" stroke-width="4"/>
  <!-- Clover accessory on top -->
  <circle cx="100" cy="30" r="10" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="89" cy="24" r="9" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="111" cy="24" r="9" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="100" cy="16" r="9" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <rect x="98" y="30" width="4" height="12" rx="2" fill="#15803d"/>
  <!-- Pips: 4 pip layout -->
  <circle cx="76" cy="76" r="7" fill="#14532d"/>
  <circle cx="124" cy="76" r="7" fill="#14532d"/>
  <circle cx="76" cy="124" r="7" fill="#14532d"/>
  <circle cx="124" cy="124" r="7" fill="#14532d"/>
  <!-- Eyes - one winking -->
  <ellipse cx="82" cy="110" rx="12" ry="13" fill="white" stroke="#14532d" stroke-width="2.5"/>
  <circle cx="84" cy="111" r="7" fill="#14532d"/>
  <circle cx="86" cy="108" r="3" fill="white" opacity="0.9"/>
  <!-- Winking eye -->
  <path d="M108 110 Q118 104 128 110" stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Playful smile -->
  <path d="M87 130 Q100 142 114 130" stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="88" cy="133" r="3" fill="#f9a8d4" opacity="0.8"/>
  <circle cx="112" cy="133" r="3" fill="#f9a8d4" opacity="0.8"/>
  <!-- Rim -->
  <rect x="30" y="30" width="140" height="140" rx="28" fill="none" stroke="#bbf7d0" stroke-width="3" opacity="0.55"/>
  <!-- Gloss -->
  <ellipse cx="64" cy="52" rx="20" ry="9" fill="white" opacity="0.25" transform="rotate(-18 64 52)"/>
</svg>
